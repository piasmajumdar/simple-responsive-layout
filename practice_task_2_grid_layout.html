<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Complex Grid layout</title>
    <style>
        * {
            box-sizing: border-box;
            color: white;
        }
        .container-main {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap:10px;
            width: 100%;
            height: 98vh;
            font-size: 2em;
            font-weight: bold;
        }

        .container-2 {
            display: grid;
            grid-template-rows: repeat(2, 1fr);
            gap: 10px;
        }
        .container-3 {
            display: grid;
            grid-template-rows: repeat(2, 1fr);
            gap: 10px;
        }
        .box-1{
            background-color: rgb(152, 18, 152);
            border-radius: 10px;
            padding: 10px;
            width: 100%;
            
        }
        .box-2 {
            background-color: yellow;
            border-radius: 10px;
            padding: 10px;
            width: 100%;
            
        }
        .box-3 {
            background-color: rgb(211, 120, 211);
            border-radius: 10px;
            padding: 10px;
            width: 100%;
        }
        .box-4 {
            background-color: grey;
            border-radius: 10px;
            padding: 10px;
            width: 100%;
        }

        @media screen and (max-width:576px) {
            .container-main {
                display: flex;
                flex-direction: column;
                height: auto;
            }
            .container-2 {
                display: flex;
                flex-direction: column;
            }
            .container-3 {
                display: flex;
                flex-direction: column;
            }
            .box-1, .box-2, .box-3, .box-4 {
                height:200px;
            }
            /* .container-main {
                display: grid;
                grid-template-columns: 100%;
            }
            .container-2 {
                display: grid;
                grid-template-rows: 100%;

            }
            .container-3 {
                display: grid;
                grid-template-rows: 100%;
            }*/
        } 
    </style>
</head>
<body>
    <div class="container-main">
        <div class="box-1">1</div>
        <div class="container-2">
            <div class="box-2">2</div>
            <div class="container-3">
                <div class="box-3">3</div>
                <div class="box-4">4</div>

            </div>
        </div>
    </div>
</body>
</html>
