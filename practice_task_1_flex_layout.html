<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Flex Layout</title>
</head>
<style>
    .container {
        display: flex;
        gap: 10px;
        border: 2px solid rgb(57, 90, 88);
    }
    .container div {
        border: 2px solid black;
        border-radius: 5px;
        display: flex;
        justify-content: center;
        align-items: center;

        font-size: 100%;
    }
    .container .left {
        width: 30%;
        background-color: #aa4343;
        height: 97vh;
    }
    .container .right {
        width: 70%;
        background-color: #9e9090;
        height: 97vh;
    }

    @media screen and (max-width: 576px) {
        .container {
            flex-direction: column;
        }
        .container .left {
            width: 100%;
            height: 28vh;
        }
        .container .right {
            width: 100%;
            height: 66vh;

        }

    }
</style>
<body>
    <div class="container">
        <div class="left"><h1>Left</h1></div>
        <div class="right"><h1>Right</h1></div>
    </div>
</body>
</html>
